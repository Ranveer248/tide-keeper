              <path
                fill="currentColor"
                d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
                transform="translate(-1 0)"
              />
            </svg>
          </button>
          <div class="pill" id="coin-pill">
            <span class="icon" id="coin-icon"></span>
            <span id="coin-count">0</span>
          </div>
          <button id="bag-btn" class="round-btn" type="button" aria-label="Keeper's bag">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 7V6a4 4 0 0 1 8 0v1h3.2l.8 14H4l.8-14zm2 0h4V6a2 2 0 0 0-4 0zm-1 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
              />
            </svg>
            <span id="bag-count" class="mini-badge hidden"></span>
          </button>
        </div>
        <div class="hud-row">
          <div class="pill small" id="crew-pill">
            <span class="icon" id="crew-icon"></span>
            <span id="crew-count">0</span>
          </div>
          <div class="pill small hidden" id="rate-pill"><span id="rate">+0/s</span></div>
        </div>
        <div id="goal">
          <div class="goal-label"><span><span id="goal-loc"></span> <span id="goal-pct"></span></span><span id="clock"></span></div>
          <div class="goal-bar"><div id="goal-fill"></div></div>
        </div>
        <div id="boosts"></div>
        <button id="career-btn" class="hidden" type="button">✉ Posting complete! Tap to decide</button>
      </div>

      <div id="toast" class="hidden"><span class="icon"></span><span class="text"></span></div>

      <div id="hint" class="hidden">Tap ships flashing <b>SOS</b> to send the rescue boat!</div>

      <div id="drawer">
        <button id="drawer-handle" type="button" aria-expanded="false">
          <span class="grip"></span>
          <span class="label">Upgrades <span id="drawer-badge" class="badge hidden"></span></span>
        </button>
        <div id="drawer-body">
          <div class="drawer-head">
            <span class="drawer-title">Lighthouse upgrades</span>
            <div class="buy-mode" role="group" aria-label="Buy amount">
              <button type="button" data-mode="1" class="on">×1</button>
              <button type="button" data-mode="10">×10</button>
              <button type="button" data-mode="max">MAX</button>
            </div>
          </div>
          <div id="upgrade-list"></div>
          <div class="drawer-foot"><span id="stats-line"></span></div>
        </div>
      </div>

      <div id="interior-panel" class="hidden">
        <div class="ip-head">
          <button id="interior-back" class="btn small" type="button">‹ Outside</button>
          <div class="ip-titles">
            <div class="ip-title">Keeper's quarters</div>
            <div id="decor-bonus"></div>
          </div>
        </div>
        <div class="ip-tabs" role="tablist">
          <button type="button" class="on" data-tab="decor" role="tab">Decor</button>
          <button type="button" data-tab="style" role="tab">Lighthouse style</button>
        </div>
        <div id="decor-list"></div>
        <div id="style-list" class="hidden"></div>
      </div>

      <div id="overlay" class="hidden"></div>
    </div>

    <div id="rotate-hint" role="alert">
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
        <rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="18.5" r="1.1" fill="currentColor" />
      </svg>
      <span>Turn your phone upright to keep watch</span>
    </div>
  </body>
</html>
