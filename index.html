n{flex:1}#style-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px 14px}.style-group h4{margin:6px 2px 8px;font:18px var(--disp);font-weight:400;color:var(--hl)}.swatches{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none}.swatch{position:relative;flex:none;width:78px;padding:6px 4px;border:3px solid var(--edge);border-radius:14px;background:linear-gradient(#cfe6ee,#9fcde6 60%,#7fc4ca);box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.swatch img{height:70px;image-rendering:pixelated}.swatch span{width:100%;padding:2px 0;border-radius:8px;background:var(--panel);color:#fff;font:11.5px var(--disp);line-height:1.2;text-align:center}.swatch.on{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-dk)}.swatch.locked img{filter:grayscale(1) brightness(.55)}.swatch .lock{position:absolute;top:28px;left:50%;transform:translate(-50%);font-style:normal;font-size:20px}.style-msg{margin:4px 2px 0;font-size:13px;color:var(--dim)}.style-msg.bad{color:var(--bad)}.reward-modal{text-align:center;align-items:stretch}.reward-burst{font-size:46px;line-height:1;animation:reward-pop .6s cubic-bezier(.2,.9,.3,1.4)}@keyframes reward-pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}.big-reward{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0;padding:12px;border:3px solid var(--edge);border-radius:16px;background:var(--well);box-shadow:inset 0 3px #0000004d;font:42px var(--disp);color:var(--good);animation:reward-pop .5s .1s cubic-bezier(.2,.9,.3,1.4) both}.reward-modal .stats{text-align:left}.coin-big{display:inline-block;width:34px;height:34px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}.coin-big.small{width:22px;height:22px}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:2px solid var(--edge);border-radius:12px;background:var(--well);font-size:11.5px;color:var(--dim)}.day.big{grid-column:span 2}.day.today{border:3px solid var(--edge);background:linear-gradient(160deg,var(--sea-green),var(--teal));color:#fff;box-shadow:0 3px 0 var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.35);animation:pulse 1.2s ease-in-out infinite}.day.today .d-num{color:#fff}.day.claimed{opacity:.5}.d-num{font:14px var(--disp);color:#fff}.d-icon{display:flex;gap:4px;align-items:center;min-height:26px}.d-icon .item-icon{width:24px;height:24px;border-width:2px;border-radius:7px;background-size:16px}.d-star{font:21px var(--disp);color:var(--hl)}.d-label{line-height:1.15;text-align:center}.d-check{position:absolute;top:2px;right:6px;color:var(--good)}.trophies-modal h2{display:flex;align-items:center;justify-content:space-between}.trophies-modal h3{margin:6px 0 0;font:22px var(--disp);font-weight:400;color:var(--hl)}.t-total{font:22px var(--disp);color:var(--hl)}.trophy-list{display:flex;flex-direction:column;gap:10px}.trophy{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:3px solid var(--edge);border-radius:16px;background:var(--panel2);box-shadow:0 4px 0 var(--edge)}.trophy:not(.earned) .t-icon{filter:grayscale(1);opacity:.45}.trophy.earned{border-color:var(--accent);background:linear-gradient(90deg,#0f4a5c,var(--panel2) 70%);box-shadow:0 4px 0 var(--accent-dk)}.t-icon{flex:none;width:34px;font-size:26px;line-height:34px;text-align:center}.t-info{flex:1;min-width:0}.t-name{font:18px var(--disp);color:#fff}.t-check{color:var(--good)}.t-desc,.t-count{font-size:13px;font-weight:700;color:var(--dim)}.t-reward{font-size:13px;color:var(--hl)}.t-bar{height:9px;margin:5px 0 2px;border:1.5px solid var(--edge);border-radius:5px;background:#061624;overflow:hidden}.t-bar i{display:block;height:100%;background:var(--good)}.stats.log{margin:0}#stage.wide #drawer,#stage.wide #interior-panel{inset:0 0 0 auto;width:var(--side-w, 340px);height:auto;margin:0;border:none;border-left:3px solid var(--edge);border-radius:0;transform:none;transition:none;animation:none;background:var(--panel);padding-top:env(safe-area-inset-top,0px)}#stage.wide #drawer-handle{height:auto;margin:0;padding:14px 0 6px;border:none;border-radius:0;background:none;cursor:default}#stage.wide #drawer-handle .grip{display:none}#stage.wide #drawer-body{margin:0;border:none;background:none}#stage.short #hud{top:calc(env(safe-area-inset-top,0px) + 6px);gap:6px}#stage.short .round-btn{width:36px;height:36px;border-radius:11px}#stage.short .round-btn svg{width:18px;height:18px}#stage.short #coin-pill{transform:scale(.85)}#stage.short #goal{padding:3px 8px 5px}#stage.short #toast{top:calc(env(safe-area-inset-top,0px) + 64px)}#stage.short #hint{font-size:14px;padding:8px 12px}@media (max-height: 520px){.title-screen.menu{gap:8px;padding-top:12px}.logo-tide{font-size:26px}.logo-keeper{font-size:46px}.logo-wave{margin-top:4px;width:160px}.menu-buttons{gap:10px}.menu-play{min-height:48px;padding:6px;font-size:24px}.gift{padding:5px 12px}.gift .streak{display:none}.menu-row .btn{min-height:40px;padding:6px}}@media (hover: hover){.btn:hover:not(:disabled),.card .buy:hover:not(:disabled),.round-btn:hover,.gift:hover,.buy-mode button:hover,.ip-tabs button:hover{filter:brightness(1.08)}.slot:hover,.job:hover,.swatch:hover{border-color:var(--accent)}}:focus-visible{outline:3px solid #fff;outline-offset:3px}@media (prefers-reduced-motion: reduce){.badge,.logo,.gift,#career-btn,#hint,.day.today,#boosts .chip.event{animation:none}}

  </head>
  <body>
    <div id="stage" data-mode="title">
      <canvas id="game"></canvas>

      <div id="hud">
        <div class="hud-top">
          <div class="hud-side">
          <button id="settings-btn" class="round-btn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
                transform="translate(-1 0)"
              />
            </svg>
          </button>
          <button id="trophy-btn" class="round-btn" type="button" aria-label="Trophies">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v4H8v-4h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1 1.7zm10 0v2.7A2 2 0 0 0 18 8V7z"
              />
            </svg>
            <span id="trophy-dot" class="mini-badge dot hidden"></span>
          </button>
          </div>
          <div class="pill" id="coin-pill">
            <span class="icon" id="coin-icon"></span>
            <span id="coin-count">0</span>
          </div>
          <div class="hud-side right">
          <button id="bag-btn" class="round-btn" type="button" aria-label="Keeper's bag">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 7V6a4 4 0 0 1 8 0v1h3.2l.8 14H4l.8-14zm2 0h4V6a2 2 0 0 0-4 0zm-1 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
              />
            </svg>
            <span id="bag-count" class="mini-badge hidden"></span>
          </button>
          </div>
        </div>
        <div class="hud-row">
          <div class="pill small" id="crew-pill">
            <span class="icon" id="crew-icon"></span>
            <span id="crew-count">0</span>
          </div>
          <div class="pill small hidden" id="rate-pill"><span id="rate">+0/s</span></div>
        </div>
        <div id="goal">
          <div class="goal-label"><span><span id="goal-loc"></span> <span id="goal-pct"></span></span><span id="clock"></span></div>
          <div class="goal-bar"><div id="goal-fill"></div></div>
        </div>
        <div id="boosts"></div>
        <button id="career-btn" class="hidden" type="button">✉ Posting complete! Tap to decide</button>
      </div>

      <div id="toast" class="hidden"><span class="icon"></span><span class="text"></span></div>

      <div id="hint" class="hidden">Tap ships flashing <b>SOS</b> to send the rescue boat!</div>

      <div id="drawer">
        <button id="drawer-handle" type="button" aria-expanded="false">
          <span class="grip"></span>
          <span class="label">Upgrades <span id="drawer-badge" class="badge hidden"></span></span>
        </button>
        <div id="drawer-body">
          <div class="drawer-head">
            <span class="drawer-title">Lighthouse upgrades</span>
            <div class="buy-mode" role="group" aria-label="Buy amount">
              <button type="button" data-mode="1" class="on">×1</button>
              <button type="button" data-mode="10">×10</button>
              <button type="button" data-mode="max">MAX</button>
            </div>
          </div>
          <div id="upgrade-list"></div>
          <div class="drawer-foot"><span id="stats-line"></span></div>
        </div>
      </div>

      <div id="interior-panel" class="hidden">
        <div class="ip-head">
          <button id="interior-back" class="btn small" type="button">‹ Outside</button>
          <div class="ip-titles">
            <div class="ip-title">Keeper's quarters</div>
            <div id="decor-bonus"></div>
          </div>
        </div>
        <div class="ip-tabs" role="tablist">
          <button type="button" class="on" data-tab="decor" role="tab">Decor</button>
          <button type="button" data-tab="style" role="tab">Lighthouse style</button>
        </div>
        <div id="decor-list"></div>
        <div id="style-list" class="hidden"></div>
      </div>

      <div id="overlay" class="hidden"></div>
    </div>

  </body>
</html>
